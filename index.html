<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="screenArea">
            <div id="screen">
                <div id="textArea"></div>
            </div>
        </div>
        
        <div id="buttonArea">
            <div id="numpad">
                <button class="inputOutput">9</button>
                <button class="inputOutput">8</button>
                <button class="inputOutput">7</button>
                <button class="inputOutput">6</button>
                <button class="inputOutput">5</button>
                <button class="inputOutput">4</button>
                <button class="inputOutput">3</button>
                <button class="inputOutput">2</button>
                <button class="inputOutput">1</button>
                <button class="inputOutput">C</button>
                <button class="inputOutput">0</button>
                <button class="inputOutput">.</button>
            </div>

            <div id="operations">
                <button class="inputOutput">+</button>
                <button class="inputOutput">-</button>
                <button class="inputOutput">*</button>
                <button class="inputOutput">/</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
